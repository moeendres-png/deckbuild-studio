[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckbuild-studio"
version = "0.1.0"
description = "Standalone collection-based Commander deckbuilder (BUILD only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mtg-deckbuilder = "deckbuild_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deckbuild_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
