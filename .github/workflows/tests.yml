name: tests

# Zielpfad im Repo: .github/workflows/tests.yml
# Änderungen gegenüber dem bisherigen Stand (Details: docs/CI_GATES_PLAN.md):
# - Push nur noch auf main -> keine Doppel-Läufe (push + pull_request) mehr auf
#   PR-Branches; der Merge-Stand auf main wird weiterhin bei jedem Push geprüft.
# - Lint ist ein eigener Job (schnelles, unabhängiges Feedback; ein Lint-Fehler
#   verdeckt keine Test-Evidenz mehr und umgekehrt).
# - concurrency: PR-Läufe ersetzen sich gegenseitig; jeder main-Push hat seine
#   eigene Gruppe (Commit-SHA) und wird nie abgebrochen.
# - setup-python pip-Cache, timeout-minutes, permissions: contents: read.
# - Die Package-Erkennung (docs-only-PRs ohne pyproject.toml) bleibt erhalten:
#   Ohne Paket enden beide Jobs grün, ohne etwas zu installieren.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python package
        id: detect
        run: echo "has_pkg=$(test -f pyproject.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          python-version: "3.12"
      - name: Install ruff (pinned)
        if: steps.detect.outputs.has_pkg == 'true'
        run: pip install ruff==0.17.4
      - name: Lint (ruff)
        if: steps.detect.outputs.has_pkg == 'true'
        run: ruff check src tests

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python package
        id: detect
        run: echo "has_pkg=$(test -f pyproject.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        if: steps.detect.outputs.has_pkg == 'true'
        run: pip install -e ".[test]"
      - name: Import smoke
        if: steps.detect.outputs.has_pkg == 'true'
        run: |
          python -c "import deckbuild_studio"
          mtg-deckbuilder --help > /dev/null
      - name: Run tests
        if: steps.detect.outputs.has_pkg == 'true'
        run: python -m pytest -q
