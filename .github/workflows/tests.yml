name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python package
        id: detect
        run: echo "has_pkg=$(test -f pyproject.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.detect.outputs.has_pkg == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.detect.outputs.has_pkg == 'true'
        run: |
          pip install -e ".[test]"
          pip install ruff==0.17.4
      - name: Lint (ruff)
        if: steps.detect.outputs.has_pkg == 'true'
        run: ruff check src tests
      - name: Import smoke
        if: steps.detect.outputs.has_pkg == 'true'
        run: |
          python -c "import deckbuild_studio"
          mtg-deckbuilder --help > /dev/null
      - name: Run tests
        if: steps.detect.outputs.has_pkg == 'true'
        run: python -m pytest -q
