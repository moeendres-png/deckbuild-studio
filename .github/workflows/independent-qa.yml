name: Independent QA acceptance
on:
  push:
    paths:
      - 'qa/**'
      - '.github/workflows/independent-qa.yml'
  pull_request:
    paths:
      - 'qa/**'
      - '.github/workflows/independent-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q qa/test_acceptance_edges.py
